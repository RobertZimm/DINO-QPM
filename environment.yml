# Conda environment with the package versions DINO-QPM was tested with.
# Usage:
#   conda env create -f environment.yml
#   conda activate DINO-QPM
#   pip install -e .
# On Linux, the torch wheel from PyPI includes CUDA 12.1. For other CUDA
# versions or CPU-only machines, install torch/torchvision first following
# https://pytorch.org/get-started/locally/ and drop them from the list below.
name: DINO-QPM
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.4.1
      - torchvision==0.19.1
      - numpy==1.26.4
      - scipy==1.15.3
      - pandas==2.2.3
      - scikit-learn==1.7.2
      - opencv-python==4.11.0.86
      - pillow==11.3.0
      - matplotlib==3.10.7
      - seaborn==0.13.2
      - tqdm==4.64.1
      - pyyaml==6.0.1
      - schedulefree==1.4.1
      - gurobipy==12.0.3
      - glm-saga==0.1.2
      - networkx==3.4.2
      - sortedcontainers==2.4.0
      - lmdb==1.7.5
      - safetensors==0.6.2
      - huggingface-hub==0.35.3
      - kagglehub==1.0.2
