[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=3.4,<4"]

[project]
name = "dino_qpm"
version = "1.0.0"
description = "Code for the paper 'DINO-QPM: Adapting Visual Foundation Models for Globally Interpretable Image Classification' (CVPRW 2026)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Robert Zimmermann", email = "zimmerro@tnt.uni-hannover.de"},
    {name = "Thomas Norrenbrock"},
    {name = "Bodo Rosenhahn"},
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Tested versions are pinned in environment.yml.
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24,<2",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.64",
    "pyyaml>=6.0",
    "schedulefree>=1.2",
    "gurobipy>=11.0",
    "glm-saga>=0.1.2",
    "networkx>=3.0",
    "sortedcontainers>=2.4",
    "lmdb>=1.4",
    "safetensors>=0.4",
    "huggingface-hub>=0.23",
    "kagglehub>=1.0",
]

[project.urls]
Paper = "https://arxiv.org/abs/2604.07166"
Code = "https://github.com/RobertZimm/DINO-QPM"
